<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventní kalendář 2025</title>
  <meta name="description" content="Adventní kalendář 2025 by Grafit.games" />
  <meta property="og:title" content="Adventní kalendář 2025" />
  <meta property="og:description" content="Adventní kalendář 2025 by Grafit.games" />
  <meta property="og:url" content="https://grafit.games/calendar/">  
  <meta property="og:image" content="https://grafit.games/assets/roboti4.png" />
  <meta property="og:type" content="website">
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://grafit.games/assets/roboti4.png" />
  <link rel="icon" type="image/png" href="../assets/Robot.png" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <!-- Festive decorations -->
  <div class="lights" aria-hidden="true"></div>
  <!-- Lightweight snow overlay; flakes are injected via JS for ambience -->
  <div class="snow" aria-hidden="true" id="snow"></div>

  <header>
    <h1>Grafit Advent</h1>
  </header>

  <!-- Doors grid remains empty until JS renders the randomized order -->
  <main class="grid" id="grid" aria-live="polite"></main>

  <!-- Modal that shows the selected day and handles the unlock flow -->
  <dialog id="dayModal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <strong id="modalTitle">Datum</strong>
      <button class="btn" id="closeModal" aria-label="Zavřít">×</button>
    </div>
    <div class="modal-body">
      <div class="game-panel" id="gamePanel"></div>
      <img id="dayImage" alt="Obrázek okénka" hidden aria-hidden="true" />
      <div class="input-row">
        <input id="dayInput" type="text" placeholder="Zadej heslo"/>
        <button class="btn primary" id="submitNote">Odemknout</button>
      </div>
      <small id="unlockHint" style="color:#ff7961;display:none">Nesprávné heslo. Zkus to znovu.</small>
      <a id="replayGame" class="btn" href="#" target="_blank" rel="noopener" hidden>Spustit hru znovu</a>
    </div>
  </dialog>

  <footer>
    <div class="footer-track" id="footerTrack">
      <span class="footer-text" id="footerText">
        Kalendář pro vás připravili Lukáš, Ondra a Honza z <a href="/" class="footer-link">Grafit.games</a>
      </span>
      <span class="footer-robot" id="footerRobot" role="img" aria-label="malý robot" tabindex="-1"></span>
    </div>
  </footer>

  <script src="calendar.js" defer></script>
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
