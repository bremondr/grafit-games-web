<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventní kalendář 2025 - Grafit.games</title>
  <meta name="description" content="Adventní kalendář od Grafit.games" />
  <link rel="stylesheet" href="calendar.css" />
</head>
<body>
  <!-- Lightweight snow overlay; flakes are injected via JS for ambience -->
  <div class="snow" aria-hidden="true" id="snow"></div>

  <header>
    <h1>Adventní hraní</h1>
    <p class="subtitle"></p>
  </header>

  <!-- Doors grid remains empty until JS renders the randomized order -->
  <main class="grid" id="grid" aria-live="polite"></main>

  <!-- Modal that shows the selected day and handles the unlock flow -->
  <dialog id="dayModal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <strong id="modalTitle">Datum</strong>
      <button class="btn" id="closeModal" aria-label="Zavřít">✕</button>
    </div>
    <div class="modal-body">
      <div class="game-panel" id="gamePanel"></div>
      <img id="dayImage" alt="Obrázek okénka" hidden aria-hidden="true" />
      <div class="input-row">
        <input id="dayInput" type="text" placeholder="Zadej kód pro odemčení obrázku" />
        <button class="btn primary" id="submitNote">Odemknout</button>
      </div>
      <small id="unlockHint" style="color:#ff7961;display:none">Nesprávný kód. Zkus to znovu.</small>
      <a id="replayGame" class="btn" href="#" target="_blank" rel="noopener" hidden>Spustit hru znovu</a>
    </div>
  </dialog>

  <footer>
    <small>Kalendář pro vás připravil Lukáš, Ondra a Honza z Grafit.games</small>
  </footer>

  <script src="calendar.js" defer></script>
</body>
</html>
