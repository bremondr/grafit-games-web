<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adventní kalendář Grafit.games</title>
  <meta name="description" content="Adventní kalendář Grafit.games se vrací i letos. Do té doby si zahrajte ten loňský." />
  <meta property="og:title" content="Adventní kalendář Grafit.games" />
  <meta property="og:description" content="Adventní kalendář se vrací i letos. Do té doby si zahrajte ten loňský." />
  <meta property="og:url" content="https://grafit.games/calendar/" />
  <meta property="og:image" content="https://grafit.games/assets/roboti4.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="../assets/Robot.png" />
  <style>
    :root { --bg: #0b1220; --text: #eaf2ff; --muted: #9fb3d1; --gold: #f7c948; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); text-align: center;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2747 0%, rgba(26, 39, 71, 0) 60%),
        radial-gradient(900px 500px at 110% -20%, #16213e 0%, rgba(22, 33, 62, 0) 60%),
        var(--bg);
    }
    main { max-width: 36rem; }
    img { width: 96px; height: auto; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.15; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 1.1rem; line-height: 1.5; }
    .btn {
      display: inline-block; margin-top: 12px; padding: 12px 22px; border-radius: 12px; font-weight: 600;
      text-decoration: none; color: #1a1f2e; background: linear-gradient(180deg, #ffd36e, var(--gold));
    }
    .btn:hover { filter: brightness(1.05); }
    .back { display: block; margin-top: 28px; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <img src="../assets/Robot.png" alt="malý robot" />
    <h1>Adventní kalendář se vrací!</h1>
    <p>I letos pro vás připravujeme adventní kalendář plný her. Startujeme v prosinci, tak nás sledujte.</p>
    <p>Do té doby si můžete zahrát loňský ročník.</p>
    <a class="btn" href="2025/">Kalendář 2025 &rarr;</a>
    <a class="back" href="/">Zpět na Grafit.games</a>
  </main>
</body>
</html>
